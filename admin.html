<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GBS Admin</title><link rel="stylesheet" href="styles.css"><style>
.adminwrap{width:min(1100px,92%);margin:35px auto}.panel{background:#15101d;border:1px solid #ffffff20;border-radius:14px;padding:20px;margin:16px 0}.panel h2{font:800 26px 'Barlow Condensed';margin:0 0 14px}.panel input,.panel select,.panel textarea{width:100%;background:#09070f;border:1px solid #ffffff25;border-radius:8px;padding:12px;color:white;margin:6px 0 12px}.panel label{font-size:11px;color:#cbbbd9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#241832;color:#e9d5ff;border:1px solid #ffffff25;border-radius:8px;padding:10px}.tab{display:none}.tab.active{display:block}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}td,th{text-align:left;padding:10px;border-bottom:1px solid #ffffff15;font-size:11px}th{color:#c084fc}.msg{color:#c084fc;font-size:12px;min-height:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><img src="assets/gbs-logo.jpg"><span>GBS<span class="brand-dot">.</span></span></a><a class="text-link" href="index.html">← VOLVER</a></header><main class="adminwrap"><div class="section-kicker">PRIVATE AREA / GBS</div><h1 style="font:900 48px 'Barlow Condensed'">ADMIN CONTROL<span style="color:#a855f7">.</span></h1>
<section class="panel" id="login"><h2>ADMIN LOGIN</h2><label>Contraseña</label><input id="pw" type="password"><button class="button" id="loginBtn">INICIAR SESIÓN</button><p class="msg" id="loginMsg"></p></section>
<div id="app" style="display:none"><div class="tabs"><button data-tab="teams">Equipos</button><button data-tab="tournaments">Torneos</button><button data-tab="results">Resultados</button><button data-tab="audit">Auditoría</button><button id="logout">Salir</button></div>
<section class="panel tab active" id="teams"><h2>SOLICITUDES Y EQUIPOS</h2><div id="teamsTable" class="scroll"></div><h2 style="margin-top:25px">REGISTRO MANUAL</h2><form id="manual"><div class="grid"><label>Equipo<input name="name" required></label><label>Capitán<input name="captain" required></label><label>Discord ID<input name="discord_id" required></label><label>Región<input name="region" required></label><label>Modalidad<input name="mode" value="Squad"></label><label>Estado<select name="status"><option value="approved">Aprobado</option><option value="pending">Pendiente</option></select></label></div><label>Roster (un jugador por línea)<textarea name="roster"></textarea></label><button class="button">AÑADIR EQUIPO</button></form></section>
<section class="panel tab" id="tournaments"><h2>CREAR TORNEO</h2><form id="newTournament"><label>Nombre<input name="name" required></label><label>Descripción<textarea name="description"></textarea></label><button class="button">CREAR CON PUNTUACIÓN GBS</button></form><div id="tournamentsTable" class="scroll"></div></section>
<section class="panel tab" id="results"><h2>REGISTRAR RESULTADO</h2><form id="newResult"><div class="grid"><label>Torneo<select name="tournament_id" id="tSel"></select></label><label>Equipo<select name="team_id" id="teamSel"></select></label><label>Partida<input name="match_label" value="Match 1"></label><label>TOP<select name="placement"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>Kills<input name="kills" type="number" min="0" value="0"></label></div><button class="button">CALCULAR Y GUARDAR</button></form><p class="msg" id="resultMsg"></p><p class="muted">TOP 1–6: puntos de posición + 1 por kill. TOP 7–12: cero puntos totales, incluidas kills.</p><div id="resultsTable" class="scroll"></div></section>
<section class="panel tab" id="audit"><h2>HISTORIAL DE CAMBIOS</h2><div id="auditTable" class="scroll"></div></section><p class="msg" id="globalMsg"></p></div></main>
<script>
let token='',teams=[],tournaments=[];const $=x=>document.getElementById(x);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
function table(rows,fields){if(!rows.length)return '<p class="muted">Sin datos.</p>';return '<table><thead><tr>'+fields.map(f=>'<th>'+f[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+fields.map(f=>'<td>'+String(r[f[0]]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function refresh(){teams=await api('/api/admin/teams');tournaments=await(await fetch('/api/tournaments')).json();$('teamsTable').innerHTML=table(teams,[['id','ID'],['name','Equipo'],['captain','Capitán'],['region','Región'],['status','Estado']])+'<div class="tabs">'+teams.filter(t=>t.status==='pending').map(t=>'<button onclick="setStatus('+t.id+',\'approved\')">Aprobar '+t.name+'</button><button onclick="setStatus('+t.id+',\'rejected\')">Rechazar '+t.name+'</button>').join('')+'</div>';$('tournamentsTable').innerHTML=table(tournaments,[['id','ID'],['name','Torneo'],['status','Estado']]);$('tSel').innerHTML=tournaments.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');$('teamSel').innerHTML=teams.filter(t=>t.status==='approved').map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');$('resultsTable').innerHTML=table(await api('/api/admin/results'),[['tournament_name','Torneo'],['team_name','Equipo'],['match_label','Partida'],['placement','TOP'],['kills','Kills'],['placement_points','TOP pts'],['kill_points','Kill pts'],['total_points','Total'],['is_manual','Manual']]);$('auditTable').innerHTML=table(await api('/api/admin/audit'),[['created_at','Fecha'],['action','Acción'],['entity_type','Tipo'],['entity_id','ID']]);}
window.setStatus=async(id,status)=>{try{await api('/api/admin/teams/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await refresh()}catch(e){$('globalMsg').textContent=e.message}};
$('loginBtn').onclick=async()=>{try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;$('login').style.display='none';$('app').style.display='block';await refresh()}catch(e){$('loginMsg').textContent=e.message}};
$('logout').onclick=()=>{token='';$('app').style.display='none';$('login').style.display='block'};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.add('active')});
$('manual').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/teams',{method:'POST',body:JSON.stringify({name:f.get('name'),captain:f.get('captain'),discord_id:f.get('discord_id'),region:f.get('region'),mode:f.get('mode'),status:f.get('status'),roster:String(f.get('roster')).split('\\n').filter(Boolean)})});e.target.reset();await refresh()}catch(x){$('globalMsg').textContent=x.message}};
$('newTournament').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/tournaments',{method:'POST',body:JSON.stringify({name:f.get('name'),description:f.get('description')})});e.target.reset();await refresh()}catch(x){$('globalMsg').textContent=x.message}};
$('newResult').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/admin/results',{method:'POST',body:JSON.stringify({tournament_id:f.get('tournament_id'),team_id:f.get('team_id'),match_label:f.get('match_label'),placement:f.get('placement'),kills:f.get('kills')})});$('resultMsg').textContent='Resultado guardado: '+d.total_points+' puntos.';await refresh()}catch(x){$('resultMsg').textContent=x.message}};
</script></body></html>
